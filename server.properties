# Configuracion del servidor - optimizada para Raspberry Pi 4 (4GB)
# Puedes editar estos valores cuando quieras (reinicia el servidor tras cambiarlos).

motd=Servidor de Isaac y amigos
max-players=8

# Solo entran los que anadas a la whitelist (mas seguro).
white-list=true
enforce-whitelist=true
online-mode=true

# Mundo y juego
level-name=world
gamemode=survival
difficulty=normal
pvp=true
hardcore=false
allow-nether=true
spawn-protection=0

# Rendimiento (clave en una Pi): distancias cortas = menos carga de CPU/RAM.
view-distance=6
simulation-distance=5
# Menos fsync al disco (mejor rendimiento con SSD/NVMe).
sync-chunk-writes=false
network-compression-threshold=256
max-tick-time=180000

# Evita expulsiones falsas con jetpacks/mecanismos de Create.
allow-flight=true
enable-command-block=false

# Conexion
server-port=25565
enable-rcon=false
